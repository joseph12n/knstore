# This configuration is intended for development purpose, it's **your** responsibility to harden it for production
name: knstore
services:
  mongodb:
    extends:
      file: ./mongodb.yml
      service: mongodb
  mongodb-init:
    extends:
      file: ./mongodb.yml
      service: mongodb-init
networks:
  knstore:
    name: knstore
volumes:
  knstore-mongodb-data:
    name: knstore-mongodb-data
