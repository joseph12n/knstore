# This configuration is intended for development purpose, it's **your** responsibility to harden it for production
name: knstore
services:
  mongodb:
    image: mongo:8.2.9
    # If you want to expose these ports outside your dev PC,
    # remove the "127.0.0.1:" prefix
    networks:
      - knstore
    ports:
      - :27018:27017
    volumes:
      - knstore-mongodb-data:/data/db/
      - knstore-mongodb-data:/data/configdb/
    healthcheck:
      test: ['CMD-SHELL', 'echo ''db.runCommand("ping").ok'' | mongosh localhost:27017/test --quiet']
      interval: 5s
      timeout: 5s
      retries: 10
networks:
  knstore:
    name: knstore
volumes:
  knstore-mongodb-data:
    name: knstore-mongodb-data
