# This configuration is intended for development purpose, it's **your** responsibility to harden it for production
name: knstore
services:
  app:
    image: eljoseph12/knstore:2.0.1
    environment:
      - _JAVA_OPTIONS=-Xmx512m -Xms256m
      - SPRING_PROFILES_ACTIVE=dev,api-docs,secret-samples
      - MANAGEMENT_PROMETHEUS_METRICS_EXPORT_ENABLED=true
      - SPRING_MONGODB_URI=mongodb://mongodb:27017/knstore?replicaSet=rs0&retryWrites=true&directConnection=true
      - SPRING_DOCKER_COMPOSE_ENABLED=false
    ports:
      - 8080:8080
    networks:
      - knstore
    healthcheck:
      test:
        - CMD-SHELL
        - "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080; printf \"GET
          /management/health HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n\" >&3;
          grep -q \"\\\"status\\\":\\\"UP\\\"\" <&3'"
      interval: 5s
      timeout: 5s
      retries: 40
    depends_on:
      mongodb:
        condition: service_healthy
  mongodb:
    extends:
      file: ./mongodb-replicaset.yml
      service: mongodb
  mongodb-init:
    extends:
      file: ./mongodb-replicaset.yml
      service: mongodb-init
networks:
  knstore:
    name: knstore
volumes:
  knstore-mongodb-data:
    name: knstore-mongodb-data
  knstore-mongodb-config:
    name: knstore-mongodb-config
